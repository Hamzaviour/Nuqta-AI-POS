name: Build Production Installers (Windows & macOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup & Portable Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Build Windows Production Installers (.exe & Portable)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Al-Deewan-POS-Windows-Installer-v2.0
          path: dist/Al-Deewan-*.exe
          if-no-files-found: error

      - name: Publish Windows Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Al-Deewan-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG & Zip Installer
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Build macOS Production DMG & Zip
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Al-Deewan-POS-macOS-Installer-v2.0
          path: |
            dist/Al-Deewan-POS-*.dmg
            dist/Al-Deewan-POS-*.zip
          if-no-files-found: error

      - name: Publish macOS Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Al-Deewan-POS-*.dmg
            dist/Al-Deewan-POS-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
